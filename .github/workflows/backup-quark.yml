name: Back up release to Quark Drive
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable GitHub release tag
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: quark-release-backup
  cancel-in-progress: false
jobs:
  backup:
    if: vars.QUARK_BACKUP_ENABLED == 'true'
    runs-on: [self-hosted, Linux, X64, hongputao-gitee-publisher]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Add isolated publisher tools
        shell: bash
        run: echo /opt/hongputao-release-runner/bin >> "$GITHUB_PATH"
      - name: Download existing stable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          metadata=$(gh release view "$RELEASE_TAG" --repo adoin/Hongguo-video-pack --json isDraft,isPrerelease)
          python3 -c 'import json,sys; r=json.loads(sys.argv[1]); sys.exit(1 if r["isDraft"] or r["isPrerelease"] else 0)' "$metadata"
          gh release download "$RELEASE_TAG" --repo adoin/Hongguo-video-pack --dir quark-dist \
            --pattern 'Hongputao-*-Setup.exe' --pattern 'Hongputao-*.apk' --pattern 'Hongputao-*.zip' --pattern SHA256SUMS.txt
      - name: Upload verified public assets to authorized Quark folder
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          QUARK_CLI_PATH: ${{ vars.QUARK_CLI_PATH }}
          QUARK_PARENT_FID: ${{ vars.QUARK_PARENT_FID }}
        shell: bash
        run: python3 -u scripts/quark-backup.py "$RELEASE_TAG" quark-dist
      - name: Report backup failure separately
        if: failure()
        shell: bash
        run: echo '::warning::Quark backup failed. GitHub Release remains published; inspect the backup job before retrying.'
